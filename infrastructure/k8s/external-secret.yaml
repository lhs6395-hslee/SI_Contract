apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: si-contract
  labels:
    app.kubernetes.io/name: app-secrets
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: si-contract
  annotations:
    note: "DB 비밀번호는 AWS Secrets Manager(si-contract-dev/app-secrets)에서 런타임 로드. 이 Secret은 fallback용."
type: Opaque
stringData:
  DATABASE_URL: ""
