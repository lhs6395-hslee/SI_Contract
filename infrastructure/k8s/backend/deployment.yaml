apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: si-contract
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: si-contract
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: si-contract
    spec:
      serviceAccountName: backend
      # 동기 파이프라인(~60초)이 롤링 배포/scale-down 시 SIGKILL로 잘리지 않게 충분히 확보.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: 264594923212.dkr.ecr.ap-northeast-2.amazonaws.com/si-contract/backend:e7df585
          ports:
            - containerPort: 8001
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: S3_FILES_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: S3_FILES_BUCKET
            - name: S3_TEMPLATES_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: S3_TEMPLATES_BUCKET
            - name: DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DYNAMODB_TABLE
            - name: DYNAMODB_PIPELINE_TABLE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DYNAMODB_PIPELINE_TABLE
            - name: AWS_SECRET_NAME
              value: "si-contract-dev/app-secrets"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
                  optional: true
            # 워커/파드 간 동일해야 함 — 미주입 시 Secrets Manager(si-contract-dev/app-secrets)에서 로드
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # ALB target deregistration_delay(15s) 동안 신규 트래픽 차단 후 종료 — 진행 요청 보호
              exec:
                command: ["sh", "-c", "sleep 15"]
