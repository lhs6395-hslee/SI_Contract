apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: si-contract
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: si-contract
data:
  CLAUDE_PROVIDER: "bedrock"
# ap-northeast-2에는 us.* inference profile이 없음 — global.* 프로필만 유효 (ValidationException 원인)
  CLAUDE_MODEL: "global.anthropic.claude-sonnet-4-6"
  DEFAULT_MODEL: "global.anthropic.claude-sonnet-4-6"
  HAIKU_MODEL: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
  S3_FILES_BUCKET: "si-contract-dev-files"
  S3_TEMPLATES_BUCKET: "si-contract-dev-templates"
  DYNAMODB_TABLE: "si-contract-dev-projects"
  DYNAMODB_PIPELINE_TABLE: "si-contract-dev-pipeline-state"
  AWS_SECRET_NAME: "si-contract-dev/app-secrets"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
  OTEL_SERVICE_NAME: "si-contract-backend"
  USE_AI_SERVICE: "false"
  AI_SERVICE_URL: "http://ai-service.si-contract.svc.cluster.local:8001"
  NEXT_PUBLIC_APP_URL: "https://si.rayhli.com"
